<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Stability Lab</title>
    
    <!-- Tailwind CSS for stunning dark UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Plotly.js for interactive engineering graphs -->
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

    <style>
        body { 
            background-color: #040814; 
            color: #f8fafc;
        }
        .glass-panel {
            background: #0b1221;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
        }
        /* Styling range sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col h-screen overflow-hidden">

    <div class="flex justify-between items-center mb-6 shrink-0">
        <div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">Aerospace Stability Analysis</h1>
            <p class="text-slate-400 text-sm font-mono mt-1 tracking-widest uppercase">Pitching Moment & CG Shift Simulation</p>
        </div>
        <div class="flex gap-4">
            <button onclick="switchTab('pitching')" id="btn-pitching" class="px-4 py-2 rounded-lg font-bold transition-all bg-cyan-600 text-white">Pitching Moment</button>
            <button onclick="switchTab('fuel')" id="btn-fuel" class="px-4 py-2 rounded-lg font-bold transition-all bg-transparent text-slate-400 border border-slate-600 hover:text-white">Fuel Burn Sim</button>
        </div>
    </div>

    <div class="flex gap-6 h-full min-h-0">
        <!-- LEFT PANEL: CONTROLS -->
        <div class="glass-panel w-1/4 flex flex-col gap-6 overflow-y-auto shrink-0">
            <div>
                <h3 class="text-xs uppercase tracking-widest text-slate-500 mb-3 font-bold">Aircraft Profile</h3>
                <select id="ac-select" class="w-full bg-[#1e293b] border border-slate-600 rounded-lg p-2 text-white font-mono" onchange="updateDashboard()">
                    <option value="A">C-130 Transport (Stable)</option>
                    <option value="B">F-16 Fighter (Neutral)</option>
                </select>
            </div>

            <hr class="border-slate-700">

            <div id="controls-pitching">
                <h3 class="text-xs uppercase tracking-widest text-cyan-500 mb-4 font-bold">Live Flight Controls</h3>
                
                <div class="mb-6">
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-mono text-slate-300">CG Position (% MAC)</span>
                        <span id="cg-val" class="font-bold text-cyan-400">30%</span>
                    </div>
                    <input type="range" id="cg-slider" min="20" max="50" step="1" value="30" oninput="updateDashboard()">
                </div>

                <div class="mb-6">
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-mono text-slate-300">Elevator (δe)</span>
                        <span id="de-val" class="font-bold text-cyan-400">0°</span>
                    </div>
                    <input type="range" id="de-slider" min="-10" max="10" step="0.5" value="0" oninput="updateDashboard()">
                </div>
            </div>

            <div id="controls-fuel" style="display: none;">
                <h3 class="text-xs uppercase tracking-widest text-orange-400 mb-4 font-bold">Fuel Simulation Controls</h3>
                
                <div class="mb-6">
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-mono text-slate-300">Fuel Mass (kg)</span>
                        <span id="fuel-val" class="font-bold text-orange-400">3000 kg</span>
                    </div>
                    <input type="range" id="fuel-slider" min="0" max="3000" step="50" value="3000" oninput="updateDashboard()">
                </div>
            </div>

            <div class="mt-auto bg-[#1e293b] p-4 rounded-lg border border-slate-700">
                <div class="text-[10px] uppercase tracking-widest text-slate-400 mb-1">Stability Margin (Cm_α)</div>
                <div id="cma-output" class="text-2xl font-mono font-bold text-green-400">-1.200</div>
                <div id="stability-status" class="text-xs font-bold uppercase tracking-widest text-green-400 mt-1">Stable</div>
            </div>
        </div>

        <!-- RIGHT PANEL: GRAPHS -->
        <div class="glass-panel w-3/4 flex flex-col overflow-y-auto">
            
            <!-- Pitching Moment Views -->
            <div id="view-pitching" class="flex flex-col gap-6 h-full">
                <div class="flex-1 relative">
                    <div id="plot1" class="absolute inset-0"></div>
                </div>
                <div class="flex-1 relative">
                    <div id="plot2" class="absolute inset-0"></div>
                </div>
            </div>

            <!-- Fuel Burn Views -->
            <div id="view-fuel" class="flex flex-col gap-6 h-full" style="display: none;">
                <div class="flex-1 relative">
                    <div id="plot3" class="absolute inset-0"></div>
                </div>
                <div class="flex-1 relative">
                    <div id="plot4" class="absolute inset-0"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- ========================================== -->
    <!-- ENGINEERING SCRIPT: AERODYNAMICS & PLOTTING -->
    <!-- ========================================== -->
    <script>
        // ==============================================================
        // AIRCRAFT DATA (From Assignment Images 2 & 3)
        // ==============================================================
        // xref: Reference CG (0.30c for both)
        // Cm0: Pitching moment at zero angle of attack
        // Cma_ref: Baseline stability derivative (slope)
        // Cmde: Elevator control power
        // CL0, CLa: Lift characteristics
        const AIRCRAFT = {
            A: { xref: 0.30, Cm0: 0.05, Cma_ref: -1.20, Cmde: -1.10, CL0: 0.20, CLa: 5.50 }, // C-130-like (Stable)
            B: { xref: 0.30, Cm0: 0.02, Cma_ref: -0.05, Cmde: -0.80, CL0: 0.10, CLa: 4.50 }  // F-16-like (Neutral)
        };

        // ==============================================================
        // MASS & CG DATA (From Assignment Image 5)
        // ==============================================================
        const W_empty = 8000;   // Structure mass (kg)
        const cg_empty = 0.30;  // Structure CG at 30% MAC
        const W_payload = 2000; // Payload mass (kg)
        const cg_payload = 0.35;// Payload CG at 35% MAC
        const cg_fuel_tank = 0.20; // Fuel tank CG at 20% MAC

        let currentTab = 'pitching';

        // Layout template for Plotly to match dark theme
        const darkLayout = {
            paper_bgcolor: 'transparent',
            plot_bgcolor: 'transparent',
            font: { color: '#94a3b8', family: 'monospace' },
            xaxis: { gridcolor: '#1e293b', zerolinecolor: '#475569', title: 'Angle of Attack α (deg)' },
            yaxis: { gridcolor: '#1e293b', zerolinecolor: '#475569', title: 'Pitching Moment (Cm)' },
            margin: { t: 30, r: 20, l: 50, b: 40 },
            hovermode: 'x unified'
        };

        // 2. Main Update Function (Triggered by any slider movement)
        function updateDashboard() {
            // Read UI states
            const acType = document.getElementById('ac-select').value;
            const cgPct = parseFloat(document.getElementById('cg-slider').value) / 100.0;
            const deDeg = parseFloat(document.getElementById('de-slider').value);
            const fuelMass = parseFloat(document.getElementById('fuel-slider').value);

            // Update UI text
            document.getElementById('cg-val').innerText = (cgPct * 100).toFixed(0) + "%";
            document.getElementById('de-val').innerText = deDeg.toFixed(1) + "°";
            document.getElementById('fuel-val').innerText = fuelMass + " kg";

            // Grab aircraft specs
            const ac = AIRCRAFT[acType];

            // ----------------------------------------------------
            // AERODYNAMIC MATHEMATICS (Image 4)
            // ----------------------------------------------------
            
            // Task 1: Generate array of alphas from -10 to +10 degrees
            const alphas = [];
            for(let a = -10; a <= 10; a += 0.5) alphas.push(a);

            // CG Shift Effect Equation (from Image 4):
            // Cma_new = Cma_ref + [(xcg - xref) / c] * CLa
            // Note: Since xcg and xref are already fractions of c (e.g. 0.30), we don't divide by c again.
            const currentCma = ac.Cma_ref + (cgPct - ac.xref) * ac.CLa;
            
            // Linear Approximation Equation (from Image 3):
            // Cm = Cm0 + Cma * alpha + Cmde * de
            const calcCm = (alpha, cma, de) => ac.Cm0 + cma * alpha + ac.Cmde * de;

            // Update Status Panel (Task 2: Identify Stability based on slope)
            // If slope (Cma) is negative, the aircraft is naturally stable.
            const isStable = currentCma < 0;
            const cmaOut = document.getElementById('cma-output');
            const statusOut = document.getElementById('stability-status');
            
            cmaOut.innerText = currentCma.toFixed(3);
            cmaOut.className = `text-2xl font-mono font-bold ${isStable ? 'text-green-400' : 'text-red-500'}`;
            statusOut.innerText = isStable ? 'STABLE' : 'UNSTABLE';
            statusOut.className = `text-xs font-bold uppercase tracking-widest mt-1 ${isStable ? 'text-green-400' : 'text-red-500'}`;

            // ----------------------------------------------------
            // PLOT 1: Pitching Moment vs Alpha (Task 1)
            // ----------------------------------------------------
            // Requirement: Plot Cm vs alpha for de = 0, +5, -5
            // The intersection with Cm=0 is the trim point (Task 2).
            const t1_ref0 = { x: alphas, y: alphas.map(a => calcCm(a, currentCma, 0)), name: 'δe = 0°', line: {dash: 'dash', color: '#64748b'} };
            const t1_ref5 = { x: alphas, y: alphas.map(a => calcCm(a, currentCma, 5)), name: 'δe = +5°', line: {dash: 'dash', color: '#22c55e'} };
            const t1_refM5= { x: alphas, y: alphas.map(a => calcCm(a, currentCma, -5)), name: 'δe = -5°', line: {dash: 'dash', color: '#ef4444'} };
            
            // Extra: Dynamic line that responds to the slider
            const t1_dyn  = { x: alphas, y: alphas.map(a => calcCm(a, currentCma, deDeg)), name: `Dynamic δe=${deDeg}°`, line: {width: 4, color: '#06b6d4'} };

            Plotly.react('plot1', [t1_ref0, t1_ref5, t1_refM5, t1_dyn], {
                ...darkLayout, title: { text: 'Pitching Moment vs Angle of Attack', font: {color: 'white'} }
            }, {responsive: true});

            // ----------------------------------------------------
            // PLOT 2: CG Sweep Effect (Task 3)
            // ----------------------------------------------------
            // Requirement: Vary CG from 0.20c to 0.50c, update Cma, plot multiple curves.
            const sweepTraces = [];
            [0.20, 0.30, 0.40, 0.50].forEach(cgSweep => {
                // Calculate new Cma for each swept CG position
                const cmaSweep = ac.Cma_ref + (cgSweep - ac.xref) * ac.CLa;
                sweepTraces.push({
                    x: alphas, y: alphas.map(a => calcCm(a, cmaSweep, 0)), 
                    name: `CG = ${cgSweep*100}%`, line: {width: 1.5, color: '#6366f1'}
                });
            });
            // Overlay current dynamic slider CG
            sweepTraces.push({
                x: alphas, y: alphas.map(a => calcCm(a, currentCma, 0)), 
                name: `Slider CG (${(cgPct*100).toFixed(0)}%)`, line: {width: 4, color: '#f8fafc'}
            });

            Plotly.react('plot2', sweepTraces, {
                ...darkLayout, title: { text: 'CG Sweep Effect (δe = 0°)', font: {color: 'white'} }
            }, {responsive: true});

            // ----------------------------------------------------
            // FUEL BURN SIMULATION (Image 5: Tasks 1-6)
            // ----------------------------------------------------
            if(currentTab === 'fuel') {
                const fuels = [];
                const cgShift = [];
                const cmaShift = [];
                const trimShift = [];

                // Task 1: Reduce fuel mass from 3000kg to 0kg
                for(let f=3000; f>=0; f-=50) {
                    fuels.push(f);
                    
                    // Total Mass (Sum of mi)
                    const mass = W_empty + W_payload + f;
                    
                    // Total Moment (Sum of mi * xi)
                    const moment = (W_empty * cg_empty) + (W_payload * cg_payload) + (f * cg_fuel_tank);
                    
                    // Task 1: Compute xcg at each step (xcg = Sum(mi*xi) / Sum(mi))
                    const cg = moment / mass;
                    cgShift.push(cg * 100);

                    // Task 2: Compute new Cma using CG relation
                    const cma = ac.Cma_ref + (cg - ac.xref) * ac.CLa;
                    cmaShift.push(cma);

                    // Task 6: Elevator Trim Compensation
                    // Assume constant angle of attack: alpha = 5
                    // Solve for delta_e: de = - (Cm0 + Cma * alpha) / Cmde
                    const trim = -(ac.Cm0 + cma * 5) / ac.Cmde;
                    trimShift.push(trim);
                }

                // Calculate values for the current slider position
                const curMass = W_empty + W_payload + fuelMass;
                const curMom = (W_empty * cg_empty) + (W_payload * cg_payload) + (fuelMass * cg_fuel_tank);
                const curCG = curMom / curMass;

                // Task 5: Plot CG vs fuel mass & Cma vs fuel mass (Plot 3)
                // Note: The point where Cma crosses 0 is the Stability Limit (Task 3).
                // The min and max values of the CG curve determine the CG Range (Task 4).
                const p3_cg = { x: fuels, y: cgShift, name: 'CG Position %', line: {color: '#3b82f6', width: 3} };
                const p3_dot = { x: [fuelMass], y: [curCG * 100], mode: 'markers', name: 'Current Fuel', marker: {color: '#f59e0b', size: 12} };
                
                Plotly.react('plot3', [p3_cg, p3_dot], {
                    ...darkLayout, 
                    title: { text: 'Task 5: CG Shift & Stability Margin vs Fuel Burn', font: {color: 'white'} },
                    xaxis: { ...darkLayout.xaxis, title: 'Fuel Mass (kg)', autorange: 'reversed' },
                    yaxis: { ...darkLayout.yaxis, title: 'CG Position (% MAC)' }
                }, {responsive: true});

                // Task 6: Plot Elevator deflection vs fuel mass (Plot 4)
                const p4_trim = { x: fuels, y: trimShift, name: 'Req. Elevator Trim', line: {color: '#22c55e', width: 3} };
                Plotly.react('plot4', [p4_trim], {
                    ...darkLayout, 
                    title: { text: 'Task 6: Required Elevator Trim (δe) to hold α = 5°', font: {color: 'white'} },
                    xaxis: { ...darkLayout.xaxis, title: 'Fuel Mass (kg)', autorange: 'reversed' },
                    yaxis: { ...darkLayout.yaxis, title: 'Elevator Deflection (deg)' }
                }, {responsive: true});
            }
        }

        // Tab Switching Logic
        function switchTab(tab) {
            currentTab = tab;
            if(tab === 'pitching') {
                document.getElementById('view-pitching').style.display = 'flex';
                document.getElementById('controls-pitching').style.display = 'block';
                document.getElementById('view-fuel').style.display = 'none';
                document.getElementById('controls-fuel').style.display = 'none';
                
                document.getElementById('btn-pitching').className = "px-4 py-2 rounded-lg font-bold transition-all bg-cyan-600 text-white";
                document.getElementById('btn-fuel').className = "px-4 py-2 rounded-lg font-bold transition-all bg-transparent text-slate-400 border border-slate-600 hover:text-white";
            } else {
                document.getElementById('view-pitching').style.display = 'none';
                document.getElementById('controls-pitching').style.display = 'none';
                document.getElementById('view-fuel').style.display = 'flex';
                document.getElementById('controls-fuel').style.display = 'block';
                
                document.getElementById('btn-fuel').className = "px-4 py-2 rounded-lg font-bold transition-all bg-orange-600 text-white";
                document.getElementById('btn-pitching').className = "px-4 py-2 rounded-lg font-bold transition-all bg-transparent text-slate-400 border border-slate-600 hover:text-white";
            }
            updateDashboard();
        }

        // Initialize on load
        window.onload = updateDashboard;
    </script>
</body>
</html>
